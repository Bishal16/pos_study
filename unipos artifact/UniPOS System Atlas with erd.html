<style>
/* Layout: control-room board. Level rail on top, diagram canvas left, inspection card right (stacks under on phones). */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --tint:#E3EAEC; --ink:#14232B; --muted:#56707C; --line:#B9C8CE;
  --accent:#0B6E78; --ok:#23804F; --bad:#C0392F; --warn:#B26B12; --idle:#8D9CA4;
  --d-id:#5560B0; --d-md:#2D7D9A; --d-pr:#6F8A1F; --d-sell:#B85E24; --d-fin:#8C4E8E; --d-sup:#6B7580;
  --f-ui:"Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#17232A; --tint:#1D2C33; --ink:#E4EDF0; --muted:#93A9B3; --line:#33474F;
  --accent:#3FC0C9; --ok:#4CC27F; --bad:#F06B60; --warn:#E5A44A; --idle:#6B7F88;
  --d-id:#8F97E6; --d-md:#5FB4D3; --d-pr:#A4C255; --d-sell:#E39058; --d-fin:#C687C8; --d-sup:#9AA4AE;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#17232A; --tint:#1D2C33; --ink:#E4EDF0; --muted:#93A9B3; --line:#33474F;
  --accent:#3FC0C9; --ok:#4CC27F; --bad:#F06B60; --warn:#E5A44A; --idle:#6B7F88;
  --d-id:#8F97E6; --d-md:#5FB4D3; --d-pr:#A4C255; --d-sell:#E39058; --d-fin:#C687C8; --d-sup:#9AA4AE;
  color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);max-width:75ch}
.mono{font-family:var(--f-mono);font-size:.86em}
nav.levels{display:flex;flex-wrap:wrap;gap:6px}
nav.levels button,.subtabs button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}
nav.levels button .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
nav.levels button[aria-selected="true"],.subtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
nav.levels button[aria-selected="true"] .n{color:var(--bg)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend svg{width:30px;height:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
@media (max-width:960px){.main{grid-template-columns:minmax(0,1fr)}}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.canvas .cap{margin:0;color:var(--muted);font-size:.9rem;max-width:90ch}
.canvas .cap b{color:var(--ink);font-weight:600}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroller svg{display:block;width:100%;height:auto;min-width:var(--minw,900px)}
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{font-size:.84rem;padding:5px 10px}
aside.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:12px;min-width:0}
@media (max-width:960px){aside.card{position:static}}
aside .kind{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
aside h2{margin:0;font-size:1.25rem;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--ink)}
.chip.ok{border-color:var(--ok);color:var(--ok)} .chip.bad{border-color:var(--bad);color:var(--bad)} .chip.idle{color:var(--muted)} .chip.warn{border-color:var(--warn);color:var(--warn)}
aside h3{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
aside ul{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
aside li.bad{color:var(--bad)} aside li.warn{color:var(--warn)}
aside .rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.86rem;margin:0}
aside .rows dt{color:var(--muted)} aside .rows dd{margin:0;overflow-wrap:anywhere}
aside .link{display:inline-flex;gap:6px;flex-wrap:wrap}
aside .hint{color:var(--muted);font-size:.85rem;margin:0}
/* svg */
svg text{font-family:var(--f-ui)}
.t1{font-size:13px;font-weight:600;fill:var(--ink)}
.t2{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.t3{font-size:12px;fill:var(--ink)}
.tag{font-size:10.5px;letter-spacing:.09em;font-weight:600;fill:var(--muted);text-transform:uppercase}
.lbl{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.lbl.warn,.t3.warn{fill:var(--warn)} .lbl.bad,.t3.bad{fill:var(--bad)} .lbl.ev{fill:var(--accent)}
.node{cursor:pointer}
.node rect.b{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.node.jwt rect.b{stroke:var(--ok);stroke-width:2.2}
.node.idle rect.b{stroke-dasharray:4 3;fill:var(--tint)}
.node.idle .t1{fill:var(--muted)}
.node.badn rect.b{stroke:var(--bad);stroke-dasharray:5 3}
.node.topic rect.b{fill:var(--tint)}
.node.topic.ok rect.b{stroke:var(--accent)}
.node.topic.warn rect.b{stroke:var(--warn)}
.node.topic.dead rect.b,.node.topic.unused rect.b{stroke:var(--idle);stroke-dasharray:3 3}
.node.topic.dead .t2,.node.topic.unused .t2{fill:var(--idle)}
.node.topic .t2{fill:var(--ink)}
.node:hover rect.b{stroke:var(--accent)}
.node.sel rect.b{stroke:var(--accent);stroke-width:3}
.node:focus{outline:none}
.node:focus-visible rect.b{stroke:var(--accent);stroke-width:3.5}
.dot.d-id{fill:var(--d-id)} .dot.d-md{fill:var(--d-md)} .dot.d-pr{fill:var(--d-pr)} .dot.d-sell{fill:var(--d-sell)} .dot.d-fin{fill:var(--d-fin)} .dot.d-sup{fill:var(--d-sup)} .dot.d-inf{fill:var(--accent)}
.grp{fill:var(--tint);stroke:none}
.host{fill:none;stroke:var(--ink);stroke-width:1.2;opacity:.55}
.net{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:6 4}
.notebox{fill:var(--tint);stroke:none}
.e{fill:none;stroke:var(--muted);stroke-width:1.3}
.e.ok{stroke:var(--ok)} .e.ev{stroke:var(--accent);stroke-dasharray:2 3;stroke-width:1.5}
.e.bad{stroke:var(--bad);stroke-dasharray:6 4;stroke-width:1.6}
.e.warn{stroke:var(--warn);stroke-dasharray:6 4}
.e.idle{stroke:var(--idle);stroke-dasharray:2 4}
.e.ret{stroke-dasharray:5 4}
.e.bus{stroke:var(--line);stroke-width:2}
.e.dim{opacity:.13}
.e.hot-out{stroke:var(--accent);stroke-width:2.2;opacity:1}
.e.hot-in{stroke:var(--d-sell);stroke-width:2.2;opacity:1}
.e.bad.hot-out,.e.bad.hot-in{stroke:var(--bad)}
.life{stroke:var(--line);stroke-dasharray:3 4}
.mk-ink{fill:var(--muted)} .mk-ok{fill:var(--ok)} .mk-bad{fill:var(--bad)} .mk-ev{fill:var(--accent)} .mk-warn{fill:var(--warn)} .mk-idle{fill:var(--idle)} .mk-out{fill:var(--accent)} .mk-in{fill:var(--d-sell)}
.stepn{fill:var(--tint);stroke:var(--line)} .stepn-t{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
@media (prefers-reduced-motion:no-preference){.e{transition:opacity .15s,stroke-width .15s}}

/* v2: lens tokens */
:root{ --v-keep:#DCEFE3; --v-change:#F6E7C8; --v-build:#D6E6F7; --v-decide:#E7DFF2; --v-remove:#F5D9D6; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --v-keep:#1E3B2C; --v-change:#3E3219; --v-build:#1C3049; --v-decide:#33284A; --v-remove:#4A2522; }}
:root[data-theme="dark"]{ --v-keep:#1E3B2C; --v-change:#3E3219; --v-build:#1C3049; --v-decide:#33284A; --v-remove:#4A2522; }
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;min-width:0}
.search{position:relative;min-width:0;flex:1 1 280px}
#q{font:inherit;font-size:.9rem;width:100%;min-width:0;box-sizing:border-box;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
#q:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#qres{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:360px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#qres li{display:flex;gap:8px;align-items:baseline;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:.86rem;overflow:hidden}
#qres li .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qres li[aria-selected="true"],#qres li:hover{background:var(--tint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:.86rem;border:0;background:var(--surface);color:var(--ink);padding:6px 11px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem;color:var(--muted)}
.crumbs button{font:inherit;border:0;background:none;color:var(--accent);padding:2px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.crumbs button:last-of-type{color:var(--ink);text-decoration:none;font-weight:600}
.scroller svg{min-width:0}
.frame{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.frame svg.main{width:100%;height:auto;max-height:78vh;touch-action:none;cursor:grab}
.frame svg.main:active{cursor:grabbing}
.frame.mini svg{width:100%;height:auto;max-height:260px}
.minicap{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.zoombar,.player,.svcpick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem}
.zoombar .hint{color:var(--muted);margin-right:auto;font-size:.8rem}
.zoombar button,.player button{font:inherit;font-size:.84rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:4px 10px;cursor:pointer;min-width:34px}
.player input[type=range]{flex:1 1 140px;accent-color:var(--accent)}
.player .pnum{color:var(--muted)}
.svcpick select{font:inherit;font-size:.86rem;padding:5px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);max-width:100%}
.oplbl{font-family:var(--f-mono);font-size:10px;fill:var(--accent);paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.oplbl.bad{fill:var(--bad)}
.hotpath{stroke:var(--accent);stroke-width:4;fill:none}
.hotbox{fill:none;stroke:var(--accent);stroke-width:3}
.mk-hot{fill:var(--accent)}
.row{cursor:pointer}
.row .rowhit{fill:transparent}
.row:hover .rowhit{fill:var(--tint)}
.row.dimrow{opacity:.28}
.row.act .rowhit{fill:var(--tint)}
.row.act .e{stroke:var(--accent);stroke-width:2.6}
.row.act .lbl{fill:var(--ink);font-weight:600}
.row.act .stepn{fill:var(--accent);stroke:var(--accent)}
.row.act .stepn-t{fill:var(--bg)}
.enthead{fill:var(--tint)}
.fl{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink)}
.ftag{fill:var(--accent);font-weight:600;font-size:9px}
.ftype{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.ftype.rel{fill:var(--accent)}
.soft{font-family:var(--f-mono);font-size:10px;fill:var(--d-sell);text-decoration:underline;cursor:pointer}
.jump,.more{cursor:pointer}
.morelbl{font-size:11px;fill:var(--accent)}
.card-n{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.node.ent rect.b{fill:var(--surface)}
/* lenses */
[data-lens="problems"] svg.main .node.sev0{opacity:.3}
[data-lens="problems"] svg.main .node.sev1 rect.b{stroke:var(--warn);stroke-width:2.4}
[data-lens="problems"] svg.main .node.sev2 rect.b{stroke:var(--bad);stroke-width:3.2}
[data-lens="problems"] svg.main .node.topic.ok{opacity:.3}
[data-lens="problems"] svg.main .e:not(.bad):not(.warn):not(.idle):not(.hot-out):not(.hot-in){opacity:.15}
[data-lens="odcl"] svg.main .node.v-keep rect.b{fill:var(--v-keep)}
[data-lens="odcl"] svg.main .node.v-change rect.b{fill:var(--v-change)}
[data-lens="odcl"] svg.main .node.v-build rect.b{fill:var(--v-build)}
[data-lens="odcl"] svg.main .node.v-decide rect.b{fill:var(--v-decide)}
[data-lens="odcl"] svg.main .node.v-remove rect.b{fill:var(--v-remove)}
.chip.v{color:var(--ink)} .chip.v-keep{background:var(--v-keep)} .chip.v-change{background:var(--v-change)} .chip.v-build{background:var(--v-build)} .chip.v-decide{background:var(--v-decide)} .chip.v-remove{background:var(--v-remove)}
/* card extras */
.cta{font:inherit;font-size:.88rem;text-align:left;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:7px 10px;cursor:pointer}
.cta:hover{background:var(--tint)}
.ctabs{display:flex;flex-wrap:wrap;gap:4px}
.ctabs button{font:inherit;font-size:.8rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;padding:4px 8px;cursor:pointer}
.ctabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.cfilter{font:inherit;font-size:.86rem;padding:6px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.tlist,.oplist{max-height:420px;overflow:auto;list-style:none;padding-left:0 !important}
.oplist li{font-size:.8rem;overflow-wrap:anywhere}
.lnk{font:inherit;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-align:left;text-decoration:underline;text-underline-offset:2px}
.lnk.on{font-weight:700;color:var(--ink)}
.muted{color:var(--muted)}
.tdetail{border:1px solid var(--line);border-radius:6px;padding:8px;max-height:360px;overflow:auto}
table.cols{border-collapse:collapse;width:100%;font-size:.78rem}
table.cols td{padding:2px 6px 2px 0;vertical-align:top;overflow-wrap:anywhere}
</style>

<div class="wrap">
  <header>
    <h1>UniPOS System Atlas</h1>
    <p>UniPOS as built today: from the front door down to every table. Pick a level, a lens, or search for anything. Click a box for details; double-click a service to go inside.</p>
  </header>
  <div class="bar">
    <nav class="levels" id="levels" role="tablist" aria-label="Detail level"></nav>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Search a table, column, operation, topic or port" role="combobox" aria-expanded="false" aria-controls="qres" aria-autocomplete="list" autocomplete="off" aria-label="Search">
        <ul id="qres" role="listbox" hidden></ul>
      </div>
      <div class="seg" id="lens" role="group" aria-label="Lens"><button data-lens="asis" aria-pressed="true">As-is</button><button data-lens="problems" aria-pressed="false">Problems</button><button data-lens="odcl" aria-pressed="false">ODCL plan</button></div>
    </div>
  </div>
  <div class="crumbs" id="crumbs" aria-label="Breadcrumb"></div>
  <div class="legend" id="legend"></div>
  <div class="main">
    <section class="canvas" aria-live="polite">
      <div class="subtabs" id="subtabs" role="tablist" aria-label="Flow" hidden></div>
      <p class="cap" id="cap"></p>
      <div class="scroller" id="scroller"></div>
    </section>
    <aside class="card" id="card"></aside>
  </div>

    const bb=n.getBBox(); const pad=Math.max(bb.width,bb.height)*1.6; v.w=bb.width+pad*2; v.h=v.w*base.h/base.w; v.x=bb.x+bb.width/2-v.w/2; v.y=bb.y+bb.height/2-v.h/2; apply(); });

  document.getElementById("zFit").onclick=()=>{ Object.assign(v,base); apply(); };
}

/* ===================== search ===================== */
const INDEX=[];
(function build(){
  SERVICES.forEach(s=>{ INDEX.push({t:"service",l:s.id+"-service",k:s.id+" "+s.app,go:{svc:s.id}}); INDEX.push({t:"port",l:":"+s.port+" "+s.id,k:String(s.port),go:{svc:s.id}}); });
  Object.entries(INFRA).forEach(([id,i])=>INDEX.push({t:"infra",l:i.name,k:id+" "+i.name,go:{infra:id}}));
  TOPICS.forEach(t=>INDEX.push({t:"topic",l:t.id,k:t.id,go:{topic:t.id}}));
  Object.entries(CODE).forEach(([svc,d])=>{
    d.entities.forEach(e=>{ INDEX.push({t:"table",l:e.table,s:svc,k:e.table+" "+e.cls,go:{svc,table:e.cls}});
      e.fields.forEach(f=>INDEX.push({t:"column",l:e.table+"."+f.c,s:svc,k:e.table+"."+f.c+" "+f.n,go:{svc,table:e.cls}})); });
    d.ops.forEach(o=>INDEX.push({t:o.k==="Q"?"query":"mutation",l:o.n,s:svc,k:o.n,go:{svc,op:o.n}}));
  });
  INDEX.forEach(x=>x.kl=x.k.toLowerCase());
})();
function searchFor(q){
  q=q.trim().toLowerCase(); if(q.length<2) return [];
  const pri={service:0,infra:0,topic:1,port:1,table:2,query:3,mutation:3,column:4};
  return INDEX.filter(x=>x.kl.includes(q)).map(x=>({x,r:(x.kl.startsWith(q)||x.l.toLowerCase().startsWith(q)?0:1)*10+pri[x.t]})).sort((a,b)=>a.r-b.r||a.x.l.length-b.x.l.length).slice(0,14).map(o=>o.x);
}
function go(g){
  stopPlay();
  if(g.topic){ state.level=4; state.sel="topic:"+g.topic; }
  else if(g.infra){ state.level=["browser","frontend","kong","gateway","consul","kafka","pg196","pg52","minio","redis","pulsehub"].includes(g.infra)&&state.level===0?0:1; state.sel=g.infra; }
  else if(g.table||g.op){ state.level=6; state.inside=g.svc; state.table=g.table||null; state.ctab=g.op?"graphql":"tables"; state.cfilter=g.op||""; if(g.table) state.expand[g.table]=true; delete PZS[pzKey()]; }
  else if(g.svc){ if(state.level>4) state.level=0; state.sel=g.svc; }
  save(); render();
}
function openInside(svc){ stopPlay(); state.level=6; state.inside=svc; state.table=null; state.ctab="tables"; state.cfilter=""; save(); render(); }

function stepCard(){
  const f=FLOWS[state.flow];

  const s=f.steps[state.step], [a,c,label,kind="sync",flag]=s, op=(STEPOPS[state.flow]||{})[state.step];
  const kinds={sync:"synchronous GraphQL call",ret:"response",ev:"Kafka event",self:"internal step"};
  const lane=id=>(f.lanes.find(l=>l[0]===id)||[id,id])[1];
  return `<p class="kind">${esc(f.name)} · step ${state.step+1} of ${f.steps.length}</p><h2>${esc(label)}</h2>
   <div class="chips"><span class="chip ${kind==="ev"?"ok":""}">${kinds[kind]}</span>${flag==="w"?`<span class="chip warn">problem</span>`:""}${flag==="b"?`<span class="chip bad">broken</span>`:""}</div>
   <dl class="rows"><dt>From</dt><dd>${esc(lane(a))}</dd><dt>To</dt><dd>${esc(lane(c))}</dd>${op?`<dt>Operation</dt><dd class="mono">${esc(op)}</dd>`:""}</dl>
   ${S[c]&&c!==a?`<button class="cta" data-open="${c}">Open ${esc(c)} inside view ›</button>`:""}`;
}
function card(){
  const el=document.getElementById("card");

  if(id.startsWith("topic:")){ const t=TOPICS.find(x=>"topic:"+x.id===id);
    const st={ok:["working","ok"],warn:["working, with a problem","warn"],unused:["no consumer","idle"],dead:["dead","bad"]}[t.st];
    el.innerHTML=`<p class="kind">Kafka topic</p><h2 class="mono">${esc(t.id)}</h2><div class="chips"><span class="chip ${st[1]}">${st[0]}</span></div><p style="margin:0;font-size:.9rem">${esc(t.note)}</p>
     <div><h3>Published by</h3><ul>${t.p.map(p=>`<li><button class="lnk" data-open="${p}">${p}</button></li>`).join("")}</ul></div>
     <div><h3>Consumed by (group)</h3>${t.c.length?`<ul>${t.c.map(c=>`<li class="${c[2]?"bad":""}"><button class="lnk" data-open="${c[0]}">${esc(c[0])}</button> <span class="mono">(${esc(c[1])})</span>${c[2]?" · never delivered":""}</li>`).join("")}</ul>`:"<p class='hint'>Nobody.</p>"}</div>`; return; }

/* ===================== player ===================== */
function stopPlay(){ if(state.playing){ clearInterval(state.playing); state.playing=null; } }
function setStep(k){ const n=FLOWS[state.flow].steps.length; state.step=Math.max(-1,Math.min(n-1,k)); render(); }
function wirePlayer(){
  const n=FLOWS[state.flow].steps.length;
  document.getElementById("pBack").onclick=()=>{ stopPlay(); setStep(state.step<=0?0:state.step-1); };
  document.getElementById("pNext").onclick=()=>{ stopPlay(); setStep(state.step+1); };
  document.getElementById("pAll").onclick=()=>{ stopPlay(); setStep(-1); };
  document.getElementById("pRange").oninput=e=>{ stopPlay(); setStep(+e.target.value); };
  document.getElementById("pPlay").onclick=()=>{ if(state.playing){ stopPlay(); render(); return; }
    if(state.step>=n-1) state.step=-1;
    state.playing=setInterval(()=>{ if(state.step>=n-1){ stopPlay(); render(); return; } setStep(state.step+1); },1700); setStep(state.step+1); };
}

  const tp=e.target.closest("[data-topic]"); if(tp&&TOPICS.find(x=>x.id===tp.dataset.topic)){ go({topic:tp.dataset.topic}); }
});
cardEl.addEventListener("input",e=>{ if(e.target.id!=="cfilter") return; state.cfilter=e.target.value; const pos=e.target.selectionStart; card(); const i=document.getElementById("cfilter"); i.focus(); try{ i.setSelectionRange(pos,pos); }catch(_){} });
/* search box */
const qi=document.getElementById("q"), qr=document.getElementById("qres"); let qsel=0, qlist=[];
function showResults(){ qlist=searchFor(qi.value); qsel=0;
  qr.hidden=!qlist.length;
  qr.innerHTML=qlist.map((x,i)=>`<li role="option" id="qo${i}" aria-selected="${i===qsel}" data-i="${i}"><span class="chip">${x.t}</span><span class="mono">${esc(x.l)}</span>${x.s?`<span class="muted">${esc(x.s)}</span>`:""}</li>`).join("");
  qi.setAttribute("aria-expanded",String(!!qlist.length)); }
qi.addEventListener("input",showResults);
qi.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!qlist.length) return; qsel=(qsel+(e.key==="ArrowDown"?1:-1)+qlist.length)%qlist.length; [...qr.children].forEach((c,i)=>c.setAttribute("aria-selected",String(i===qsel))); qi.setAttribute("aria-activedescendant","qo"+qsel); }
  else if(e.key==="Enter"){ if(qlist[qsel]){ go(qlist[qsel].go); qr.hidden=true; qi.blur(); } }
  else if(e.key==="Escape"){ qr.hidden=true; } });
qr.addEventListener("mousedown",e=>{ const l=e.target.closest("li"); if(!l) return; e.preventDefault(); go(qlist[+l.dataset.i].go); qr.hidden=true; });
qi.addEventListener("blur",()=>setTimeout(()=>qr.hidden=true,150));
render();

</script>

</body></html>
