  color-scheme:dark }}
:root[data-theme="dark"]{

.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px;max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);max-width:75ch}
.mono{font-family:var(--f-mono);font-size:.86em}
nav.levels{display:flex;flex-wrap:wrap;gap:6px}
nav.levels button,.subtabs button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:6px;cursor:pointer;display:flex;gap:8px;align-items:baseline}

button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.82rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend svg{width:30px;height:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}

.canvas{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0;display:flex;flex-direction:column;gap:10px}
.canvas .cap{margin:0;color:var(--muted);font-size:.9rem;max-width:90ch}
.canvas .cap b{color:var(--ink);font-weight:600}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}

.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.subtabs button{font-size:.84rem;padding:5px 10px}

.net{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:6 4}
.notebox{fill:var(--tint);stroke:none}
.e{fill:none;stroke:var(--muted);stroke-width:1.3}
.e.ok{stroke:var(--ok)} .e.ev{stroke:var(--accent);stroke-dasharray:2 3;stroke-width:1.5}
.e.bad{stroke:var(--bad);stroke-dasharray:6 4;stroke-width:1.6}
.e.warn{stroke:var(--warn);stroke-dasharray:6 4}
.e.idle{stroke:var(--idle);stroke-dasharray:2 4}
.e.ret{stroke-dasharray:5 4}
.e.bus{stroke:var(--line);stroke-width:2}
.e.dim{opacity:.13}

.e.hot-in{stroke:var(--d-sell);stroke-width:2.2;opacity:1}
.e.bad.hot-out,.e.bad.hot-in{stroke:var(--bad)}
.life{stroke:var(--line);stroke-dasharray:3 4}
.mk-ink{fill:var(--muted)} .mk-ok{fill:var(--ok)} .mk-bad{fill:var(--bad)} .mk-ev{fill:var(--accent)} .mk-warn{fill:var(--warn)} .mk-idle{fill:var(--idle)} .mk-out{fill:var(--accent)} .mk-in{fill:var(--d-sell)}

@media (prefers-reduced-motion:no-preference){.e{transition:opacity .15s,stroke-width .15s}}
</style>

    let v=[c[0]-x2,c[1]-y2]; L=Math.hypot(...v); const e=edgeTrim(x2,y2,v[0]/L,v[1]/L,NW,NH);
    const bad=BADCALLS[from+">"+to]; let cls=bad?"bad":"";
    if(state.sel && S[state.sel]){ if(from===state.sel) cls+=" hot-out"; else if(to===state.sel) cls+=" hot-in"; else cls+=" dim"; }
    const m = cls.includes("hot-out")&&!bad?"out":cls.includes("hot-in")&&!bad?"in":mkFor(cls);
    b+=`<path class="e ${cls}" d="M${s[0].toFixed(1)},${s[1].toFixed(1)} Q${c[0].toFixed(1)},${c[1].toFixed(1)} ${e[0].toFixed(1)},${e[1].toFixed(1)}" marker-end="url(#m-${m})"><title>${from} → ${to}${bad?" ("+bad+")":""}</title></path>`;
  }));
  RING.forEach(id=>{ const [x,y]=P[id]; b+=node(id,x-NW/2,y-NH/2,NW,NH,id,":"+S[id].port); });
  b+=`<text class="lbl" x="${CX}" y="${CY-6}" text-anchor="middle">47 direct calls</text><text class="lbl" x="${CX}" y="${CY+10}" text-anchor="middle">http://&lt;svc&gt;-service:&lt;port&gt;/graphql/</text>`;
  return svg(W,H,b,"Service call map: 18 services in a ring, arrows for direct GraphQL calls",820);
}

/* ===================== Level 4 ===================== */
function spread(items,minGap,top,bottom){
  items.sort((a,b)=>a.y-b.y);
  for(let i=1;i<items.length;i++) if(items[i].y-items[i-1].y<minGap) items[i].y=items[i-1].y+minGap;
  const over=items.length? items[items.length-1].y-bottom:0; if(over>0) items.forEach(it=>it.y-=over);
  for(let i=0;i<items.length;i++) if(items[i].y<top) items[i].y=top+(i?0:0);
  for(let i=1;i<items.length;i++) if(items[i].y-items[i-1].y<minGap) items[i].y=items[i-1].y+minGap;
  return items;
}
function L4(){
  let b=""; const TX=460,TW=280,TH=24,top=72,step=32; const ty={};
  TOPICS.forEach((t,i)=>ty[t.id]=top+i*step);
  const bottom=top+(TOPICS.length-1)*step;
  const prods={},cons={};
  TOPICS.forEach(t=>{ t.p.forEach(p=>(prods[p]=prods[p]||[]).push(ty[t.id])); (t.c.length?t.c:[["none"]]).forEach(c=>(cons[c[0]]=cons[c[0]]||[]).push(ty[t.id])); });
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const PL=spread(Object.keys(prods).map(id=>({id,y:avg(prods[id])})),46,top,bottom);
  const CL=spread(Object.keys(cons).map(id=>({id,y:avg(cons[id])})),46,top,bottom);
  const py=Object.fromEntries(PL.map(p=>[p.id,p.y])), cy=Object.fromEntries(CL.map(c=>[c.id,c.y]));
  b+=`<text class="tag" x="40" y="40">Producer</text><text class="tag" x="${TX}" y="40">Topic</text><text class="tag" x="990" y="40">Consumer</text>`;
  TOPICS.forEach(t=>{ const y=ty[t.id];
    t.p.forEach(p=>{ const c=t.st==="ok"||t.st==="warn"?"ev":"idle"; b+=pathA(`M210,${py[p]} C335,${py[p]} 335,${y} ${TX-2},${y}`,c); });
    if(t.c.length) t.c.forEach(c=>{ const cls=c[2]?"bad":(t.st==="dead"?"idle":"ev"); b+=pathA(`M${TX+TW},${y} C865,${y} 865,${cy[c[0]]} 988,${cy[c[0]]}`,cls); });
    else b+=pathA(`M${TX+TW},${y} C865,${y} 865,${cy.none} 988,${cy.none}`,"idle");
  });
  TOPICS.forEach(t=>{ const y=ty[t.id];
    b+=`<g class="node topic ${t.st}" data-id="topic:${t.id}" tabindex="0" role="button" aria-label="${t.id}"><rect class="b" x="${TX}" y="${y-TH/2}" width="${TW}" height="${TH}" rx="4"/><text class="t2" x="${TX+10}" y="${y+4}">${t.id}</text></g>`; });
  PL.forEach(p=>b+=node(p.id,40,p.y-17,170,34,p.id,""));
  CL.forEach(c=>{ if(c.id==="none") b+=`<g class="node idle" data-id="none" tabindex="0" role="button" aria-label="no consumer"><rect class="b" x="990" y="${c.y-17}" width="170" height="34" rx="5"/><text class="t1" x="1004" y="${c.y+5}">no consumer</text></g>`; else b+=node(c.id,990,c.y-17,170,34,c.id,""); });
  return svg(1200,bottom+40,b,"Kafka event map: producers, 22 topics, consumers",960);
}

/* ===================== Level 5 ===================== */
function L5(){
  const f=FLOWS[state.flow]; const LW=170, LM=60; const lanes=f.lanes; const W=LM+lanes.length*LW+40, H=110+f.steps.length*40;
  const X={}; lanes.forEach((l,i)=>X[l[0]]=LM+LW/2+i*LW);
  let b="";
  lanes.forEach(l=>{ const x=X[l[0]];
    b+=`<path class="life" d="M${x},66 V${H-10}"/>`;
    const id=S[l[0]]||INFRA[l[0]]?l[0]:null;
    if(id) b+=node(id,x-LW/2+8,20,LW-16,42,l[1],"");
    else b+=`<g><rect class="b" x="${x-LW/2+8}" y="20" width="${LW-16}" height="42" rx="5" style="fill:var(--tint);stroke:var(--line)"/><text class="t1" x="${x-LW/2+20}" y="46">${esc(l[1])}</text></g>`;
  });
  f.steps.forEach((s,k)=>{ const y=100+k*40; const [a,c,label,kind="sync",flag]=s; const xa=X[a],xc=X[c];
    let cls=kind==="ev"?"ev":kind==="ret"?"ret":""; if(flag==="w") cls+=" warn"; if(flag==="b") cls+=" bad";
    const lc=flag==="w"?"warn":flag==="b"?"bad":kind==="ev"?"ev":"";
    b+=`<circle class="stepn" cx="24" cy="${y}" r="10"/><text class="stepn-t" x="24" y="${y+3.5}" text-anchor="middle">${k+1}</text>`;
    if(a===c){ b+=pathA(`M${xa},${y-7} h28 v14 h-26`,cls); b+=`<text class="lbl ${lc}" x="${xa+34}" y="${y+4}">${esc(label)}</text>`; }
    else { const dir=xc>xa?1:-1; b+=pathA(`M${xa},${y} L${xc-dir*3},${y}`,cls);
      const span=Math.abs(xc-xa), tw=label.length*6.4; const lx=Math.min(xa,xc)+8;
      b+= tw<span-16? `<text class="lbl ${lc}" x="${(xa+xc)/2}" y="${y-6}" text-anchor="middle">${esc(label)}</text>` : `<text class="lbl ${lc}" x="${lx}" y="${y-6}">${esc(label)}</text>`; }
  });
  return svg(W,H,b,f.name+" sequence",Math.max(820,W*0.8));
}

/* ===================== card ===================== */
function li(arr,cls=""){ return `<ul>${arr.map(x=>`<li class="${cls}">${esc(x)}</li>`).join("")}</ul>`; }
function card(id){
  const el=document.getElementById("card");
  if(!id){ el.innerHTML=`<p class="hint">Click any box in the diagram to see its details.</p>`; return; }
  if(id.startsWith("topic:")){ const t=TOPICS.find(x=>"topic:"+x.id===id);
    const st={ok:["working","ok"],warn:["working, with a problem","warn"],unused:["no consumer","idle"],dead:["dead","bad"]}[t.st];
    el.innerHTML=`<p class="kind">Kafka topic</p><h2 class="mono">${esc(t.id)}</h2><div class="chips"><span class="chip ${st[1]}">${st[0]}</span></div>
     <p style="margin:0;font-size:.9rem">${esc(t.note)}</p>
     <div><h3>Published by</h3>${li(t.p)}</div>
     <div><h3>Consumed by (group)</h3>${t.c.length?`<ul>${t.c.map(c=>`<li class="${c[2]?"bad":""}">${esc(c[0])} <span class="mono">(${esc(c[1])})</span>${c[2]?" · never delivered":""}</li>`).join("")}</ul>`:"<p class='hint'>Nobody.</p>"}</div>`; return; }
  if(id==="none"){ el.innerHTML=`<p class="kind">Kafka</p><h2>No consumer</h2><p class="hint">Topics that are published but read by nobody: ${TOPICS.filter(t=>!t.c.length).map(t=>t.id).join(", ")}.</p>`; return; }
  const s=S[id];
  if(s){
    const out=CALLS[id]||[]; const inn=Object.keys(CALLS).filter(k=>CALLS[k].includes(id));
    const prod=TOPICS.filter(t=>t.p.includes(id)).map(t=>t.id); const cons=TOPICS.filter(t=>t.c.some(c=>c[0]===id)).map(t=>t.id+(t.c.find(c=>c[0]===id)[2]?" (broken)":""));
    const jwt=s.jwt===true?`<span class="chip ok">verifies JWT</span>`:s.jwt==="own"?`<span class="chip">issues JWT</span>`:`<span class="chip idle">no JWT check</span>`;
    el.innerHTML=`<p class="kind">${esc(DOMAINS[s.dom].name)} · microservice</p><h2>${esc(id)}-service</h2>
     <div class="chips"><span class="chip">:${s.port}</span>${jwt}${s.ip?`<span class="chip">${s.ip}</span>`:""}</div>
     <dl class="rows"><dt>App name</dt><dd class="mono">${esc(s.app)}</dd><dt>Database</dt><dd><span class="mono">${esc(s.db)}</span> @ ${esc(s.host)}</dd><dt>Stack</dt><dd>Spring Boot 3.5, Java 17, DGS GraphQL, war on Tomcat</dd></dl>
     <div><h3>Main tables</h3>${li(s.tables)}</div>
     <div><h3>Calls (GraphQL)</h3><dl class="rows"><dt>out</dt><dd>${out.map(o=>BADCALLS[id+">"+o]?`<span style="color:var(--bad)">${o} ✕</span>`:o).join(", ")||"—"}</dd><dt>in</dt><dd>${inn.join(", ")||"—"}</dd></dl></div>
     <div><h3>Kafka</h3><dl class="rows"><dt>publishes</dt><dd class="mono">${prod.join(", ")||"—"}</dd><dt>consumes</dt><dd class="mono">${cons.join(", ")||"—"}</dd></dl></div>
     <div><h3>Findings</h3>${li(s.find,"warn")}</div>
     <div><h3>Read more</h3><p class="hint"><span class="mono">_unipos-study/${esc(s.notes)}</span> · ERD <span class="mono">${esc(s.erd)}</span></p></div>`;
    return;
  }
  const i=INFRA[id];
  if(i){
    el.innerHTML=`<p class="kind">${esc(i.kind)}</p><h2>${esc(i.name)}</h2>
     <dl class="rows">${i.rows.map(r=>`<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
     ${i.find.length?`<div><h3>Findings</h3>${li(i.find,"warn")}</div>`:""}
     ${i.notes?`<div><h3>Read more</h3><p class="hint"><span class="mono">_unipos-study/${esc(i.notes)}</span></p></div>`:""}`;
    return;
  }
  el.innerHTML=`<p class="hint">No details for this box.</p>`;
}

/* ===================== render ===================== */
const RENDER=[L0,L1,L2,L3,L4,L5];
function legend(){
  const sw=(d,cls)=>`<svg viewBox="0 0 30 14" aria-hidden="true">${defs()}<path class="e ${cls}" d="${d}"/></svg>`;
  const box=(cls)=>`<svg viewBox="0 0 30 14" aria-hidden="true"><g class="node ${cls}"><rect class="b" x="2" y="2" width="26" height="10" rx="2"/></g></svg>`;
  document.getElementById("legend").innerHTML=
   `<span>${box("jwt")}verifies JWT</span><span>${box("idle")}not running / no consumer</span><span>${sw("M1,7 H29","")}sync GraphQL call</span><span>${sw("M1,7 H29","ev")}Kafka event</span><span>${sw("M1,7 H29","bad")}broken / wrong config</span><span>${sw("M1,7 H29","warn")}works, with a problem</span>`
   +`<span>${["id","md","pr","sell","fin","sup"].map(d=>`<svg viewBox="0 0 10 14" style="width:10px" aria-hidden="true"><circle class="dot ${DOMAINS[d].cls}" cx="5" cy="7" r="4"/></svg>${DOMAINS[d].name}`).join(" ")}</span>`;
}
function render(){
  document.querySelectorAll("#levels button").forEach(b=>b.setAttribute("aria-selected",String(+b.dataset.l===state.level)));
  const st=document.getElementById("subtabs"); st.hidden=state.level!==5;
  st.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.f===state.flow)));
  document.getElementById("cap").innerHTML= state.level===5? `<b>${esc(FLOWS[state.flow].name)}.</b> ${esc(FLOWS[state.flow].cap)}` : LEVELS[state.level].cap;
  document.getElementById("scroller").innerHTML=RENDER[state.level]();
  document.querySelectorAll("#scroller .node").forEach(n=>n.classList.toggle("sel",n.dataset.id===state.sel));
  card(state.sel);
}
function select(id){ state.sel=id; if(state.level===3) render(); else { document.querySelectorAll("#scroller .node").forEach(n=>n.classList.toggle("sel",n.dataset.id===id)); card(id); } }
document.getElementById("levels").innerHTML=LEVELS.map(l=>`<button role="tab" data-l="${l.n}"><span class="n">${l.n}</span>${esc(l.name)}</button>`).join("");
document.getElementById("subtabs").innerHTML=Object.entries(FLOWS).map(([k,f])=>`<button role="tab" data-f="${k}">${esc(f.name)}</button>`).join("");
document.getElementById("levels").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.level=+b.dataset.l; if(state.level===3 && !S[state.sel]) state.sel="sales"; save(); render(); });
document.getElementById("subtabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; state.flow=b.dataset.f; save(); render(); });
const sc=document.getElementById("scroller");
sc.addEventListener("click",e=>{ const n=e.target.closest(".node"); if(n&&n.dataset.id) select(n.dataset.id); });
sc.addEventListener("keydown",e=>{ if(e.key!=="Enter"&&e.key!==" ") return; const n=e.target.closest(".node"); if(n&&n.dataset.id){ e.preventDefault(); select(n.dataset.id); } });
legend(); render();
</script>

</body></html>
