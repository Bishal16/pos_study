<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pull · UniPOS Control</title>
<link rel="stylesheet" href="app.css"><script src="app.js"></script>
</head><body>
<main>
  <div class="panel hero">
    <div><h1>Pull all repos</h1><p class="sub">Runs <code>projects/pull-all.sh</code>: <code>git pull --ff-only</code> on the checked-out branch of every repo. It never merges, stashes or overwrites; repos with local changes or a diverged branch are skipped and listed.</p></div>
    <div class="act"><div class="btns"><button id="cancel" hidden>Cancel</button><button class="primary" id="go">⬇ Pull all</button></div><div class="lastrun" id="last"></div></div>
  </div>
  <div class="panel livecard" id="live" hidden>
    <div class="stepper" id="steps"></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="cur" id="cur"></div>
  </div>
  <div id="result"></div>
  <details class="logcard" id="raw"><summary>Full log</summary><pre class="log" id="log"></pre></details>
</main>
<script>
runPage({
  action: 'pull',
  progress(text) {
    const seen = [...text.matchAll(/^>> Pulling (\S+)/gm)].map(m => m[1]);
    const doneAll = /PULL REPORT/.test(text);
    return { done: doneAll ? seen.length : Math.max(seen.length - 1, 0), label: doneAll ? 'Writing report…' : seen.length ? 'Pulling ' + seen.at(-1) : '' };
  },
  render(s, text) {
    const sec = parseSections(text).filter(x => !/uncommitted local files/i.test(x.title));
    return sec.length ? renderKpis(sec) + renderGroups(sec) : '';
  }
});
</script>
</body></html>
