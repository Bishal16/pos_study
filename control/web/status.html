<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status · UniPOS Control</title>
<link rel="stylesheet" href="app.css"><script src="app.js"></script>
</head><body>
<main>
  <div class="panel hero">
    <div><h1>Local work status</h1><p class="sub">Fetches every repo first (remote refs only; your files are not touched), then runs <code>projects/status-all.sh</code>: commits not pulled, files not committed and commits not pushed. Click a repo to see its commits or files.</p></div>
    <div class="act"><div class="btns"><button id="cancel" hidden>Cancel</button><button class="primary" id="go">Check status</button></div><div class="lastrun" id="last"></div></div>
  </div>
  <div class="panel livecard" id="live" hidden>
    <div class="stepper" id="steps"></div>
    <div class="progress"><i id="bar"></i></div>
    <div class="cur" id="cur"></div>
  </div>
  <div id="result"></div>
  <details class="logcard" id="raw"><summary>Full log</summary><pre class="log" id="log"></pre></details>
</main>
<script>
runPage({
  action: 'status',
  autoRunAfterMin: 5,
  steps: ['Fetch remotes', 'Check local work', 'Summary'],
  progress(text, total) {
    const fetched = [...text.matchAll(/^ +(?:fetched|FETCH FAILED) (\S+?):?(?:\s|$)/gm)].map(m => m[1]);
    const checked = [...text.matchAll(/^>> (\S+) \(/gm)].map(m => m[1]);
    if (/SUMMARY/.test(text)) return { step: 2, done: total, label: 'Summarising…' };
    if (checked.length) return { step: 1, done: Math.max(checked.length - 1, 0), label: 'Checking ' + checked.at(-1) };
    return { step: 0, done: fetched.length, label: fetched.length ? 'Fetched ' + fetched.at(-1) : 'Fetching…' };
  },
  async render(s, text) {
    const sec = parseSections(text);
    const failed = [...text.matchAll(/^ +FETCH FAILED (\S+?):/gm)].map(m => m[1]);
    const r = await api('/api/repos');
    const behind = r.repos.filter(x => x.behind > 0);
    const np = { title: '↓ Not pulled', n: behind.length, items: behind.map(x => `${x.name} (${x.behind} new commit${x.behind > 1 ? 's' : ''})`),
      detail: Object.fromEntries(behind.map(x => [x.name, { lines: x.incoming || [] }])) };
    const all = [np, ...sec];
    return (failed.length ? `<div class="note warn">Could not fetch ${failed.length} repo(s) (off the VPN?): ${esc(failed.join(', '))}. Their "not pulled" count is from the last successful fetch.</div>` : '') +
      renderKpis(all) +
      (behind.length ? `<div class="note info" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">${behind.length} repo(s) have new commits on GitLab. <a class="btn" href="/pull.html?run=1">⬇ Pull all</a><span class="muted">Pull only fast-forwards; repos with local changes are skipped.</span></div>` : '') +
      renderGroups(all, parseRepoBlocks(text));
  }
});
</script>
</body></html>
