<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Status · UniPOS Control</title>
<link rel="stylesheet" href="/app.css"><script src="/app.js"></script>
</head><body>
<main>
  <h1>Local work status</h1>
  <p class="sub">Runs <code>projects/status-all.sh</code> (read-only): files not committed and commits not pushed, in every repo. Click a repo to see its files and commits.</p>
  <div class="row"><button class="primary" id="go">Check status</button><button id="cancel" hidden>Cancel</button><span class="muted" id="state"></span></div>
  <div id="result"></div>
  <details id="raw"><summary>Full log</summary><pre class="log" id="log"></pre></details>
</main>
<script>
const ACTION = 'status';
function show(s, text) {
  const ok = s.job.exit === 0;
  $('#state').innerHTML = `${ok ? '<span class="badge b-ok">done</span>' : `<span class="badge b-bad">exit ${s.job.exit}</span>`} ${esc(when(s.job.end))} · ${esc(dur(s.job))}`;
  const sec = parseSections(text);
  $('#result').innerHTML = sec.length ? '<h2>Result</h2>' + renderGroups(sec, parseRepoBlocks(text)) : '';
  $('#go').disabled = false;
}
async function go(attachId) {
  $('#go').disabled = true; $('#raw').open = true; $('#result').innerHTML = '';
  $('#state').innerHTML = '<span class="spin"></span> running…';
  try {
    const opts = { cancelBtn: $('#cancel'), onDone: show };
    attachId ? await attachJob(attachId, $('#log'), opts) : await runJob(ACTION, {}, $('#log'), opts);
  } catch (e) { alertNote(e.message); $('#go').disabled = false; $('#state').textContent = ''; }
}
$('#go').onclick = () => go();
(async () => {
  const h = await api('/api/history');
  if (h.runningId && h.runningId.endsWith('-' + ACTION)) return go(h.runningId);
  const lastRun = [...h.history].reverse().find(x => x.action === ACTION);
  if (new URLSearchParams(location.search).get('run') && !h.runningId) { history.replaceState(null, '', location.pathname); return go(); }
  if (lastRun) { const s = await attachJob(lastRun.id, $('#log'), { onDone: show }); $('#raw').open = false; }
})().catch(e => alertNote(e.message));
</script>
</body></html>
