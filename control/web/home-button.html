<!-- UniPOS Control "home" button + light/dark toggle, appended to the Atlas and Living ERD pages by their build.py.
     Theme toggle: shown everywhere; the choice is saved per site (localStorage "unipos-theme"), see theme-early.js.
     Home button, opened through the control panel (http://127.0.0.1|localhost:877x): links back to it.
     Opened from disk (file://): greyed out, explains how to open the control panel.
     Anywhere else (published on claude.ai): hidden. -->
<style>
#ctlh{position:fixed;left:12px;bottom:12px;z-index:2147483000;font:500 12.5px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#ctlh .row{display:flex;gap:6px}
#ctlh a[hidden]{display:none}
#ctlh a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;text-decoration:none;
  background:#ffffff;color:#1c2230;border:1px solid #d5d9e0;box-shadow:0 2px 8px rgba(0,0,0,.12);cursor:pointer}
#ctlh a:hover{border-color:#0f766e;color:#0f766e}
#ctlh a.off{opacity:.55;cursor:not-allowed}
#ctlh a.off:hover{border-color:#d5d9e0;color:#1c2230}
#ctlh .msg{display:none;margin-top:6px;max-width:300px;padding:8px 10px;border-radius:8px;background:#fdf3e2;color:#8a4b06;border:1px solid #f1d7a8}
#ctlh.show .msg{display:block}
#ctlh.dark a{background:#171b23;color:#e6e9ef;border-color:#2a303b}
#ctlh.dark a:hover{border-color:#2dd4bf;color:#2dd4bf}
#ctlh.dark a.off:hover{border-color:#2a303b;color:#e6e9ef}
#ctlh.dark .msg{background:#2a2111;color:#fbbf24;border-color:#4a3a18}
@media print{#ctlh{display:none!important}}
</style>
<div id="ctlh"><div class="row"><a href="/" title="Back to UniPOS Control" hidden>⌂ Control</a><a id="ctlt" role="button" tabindex="0"></a></div><div class="msg"></div></div>
<script>
(function () {
  var box = document.getElementById('ctlh'), a = box.firstElementChild.firstElementChild, msg = box.lastElementChild;
  // light/dark toggle: flips the effective theme and remembers it
  var root = document.documentElement, tb = document.getElementById('ctlt'), mq = matchMedia('(prefers-color-scheme: dark)');
  var isDark = function () { var t = root.getAttribute('data-theme'); return t ? t === 'dark' : mq.matches; };
  var paint = function () { var d = isDark(); box.classList.toggle('dark', d); tb.textContent = d ? '☀ Light' : '☾ Dark'; tb.title = 'Switch to ' + (d ? 'light' : 'dark') + ' mode'; };
  var flip = function () { var t = isDark() ? 'light' : 'dark'; root.setAttribute('data-theme', t); try { localStorage.setItem('unipos-theme', t); } catch (e) {} paint(); };
  tb.onclick = flip;
  tb.onkeydown = function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } };
  if (mq.addEventListener) mq.addEventListener('change', paint);
  paint();
  var local = location.protocol === 'http:' && /^(127\.0\.0\.1|localhost):877\d$/.test(location.host);
  if (local) { a.hidden = false; return; }
  if (location.protocol !== 'file:') return;
  var text = 'The control panel only works when this page is opened from it. Run control/start.sh, then use http://127.0.0.1:8770/';
  a.hidden = false;
  a.removeAttribute('href');
  a.className = 'off';
  a.title = text;
  msg.textContent = text;
  a.onclick = function () { box.classList.toggle('show'); };
})();
</script>
