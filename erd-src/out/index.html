<title>UniPOS Living ERD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a drafting table. Toolbar on top, schema canvas left, inspection card right (stacks under on phones). */
:root{
  --bg:#EEF2F3; --surface:#FFFFFF; --tint:#E3EAEC; --ink:#14232B; --muted:#56707C; --line:#B9C8CE;
  --accent:#0B6E78; --ok:#23804F; --bad:#C0392F; --warn:#B26B12; --prop:#7448C2; --hot:#D9661F;
  --d-id:#5560B0; --d-md:#2D7D9A; --d-pr:#6F8A1F; --d-sell:#B85E24; --d-fin:#8C4E8E; --d-sup:#6B7580;
  --f-ui:"Instrument Sans","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#17232A; --tint:#1D2C33; --ink:#E4EDF0; --muted:#93A9B3; --line:#33474F;
  --accent:#3FC0C9; --ok:#4CC27F; --bad:#F06B60; --warn:#E5A44A; --prop:#B79BF0; --hot:#F0954E;
  --d-id:#8F97E6; --d-md:#5FB4D3; --d-pr:#A4C255; --d-sell:#E39058; --d-fin:#C687C8; --d-sup:#9AA4AE; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#17232A; --tint:#1D2C33; --ink:#E4EDF0; --muted:#93A9B3; --line:#33474F;
  --accent:#3FC0C9; --ok:#4CC27F; --bad:#F06B60; --warn:#E5A44A; --prop:#B79BF0; --hot:#F0954E;
  --d-id:#8F97E6; --d-md:#5FB4D3; --d-pr:#A4C255; --d-sell:#E39058; --d-fin:#C687C8; --d-sup:#9AA4AE; color-scheme:dark }
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header h1{font-size:1.5rem;font-weight:700;letter-spacing:-.01em;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:.92rem;max-width:90ch}
.mono{font-family:var(--f-mono);font-size:.86em}
.muted{color:var(--muted)}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.btn{font-size:.86rem;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 11px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.prop{border-color:var(--prop);color:var(--prop)}
select.btn{padding:6px 8px;max-width:100%}
.search{position:relative;flex:1 1 260px;min-width:0}
#q{width:100%;box-sizing:border-box;font:inherit;font-size:.9rem;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
#qres{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;max-height:360px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#qres li{display:flex;gap:8px;align-items:baseline;padding:5px 6px;border-radius:4px;cursor:pointer;font-size:.86rem;overflow:hidden}
#qres li .mono{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#qres li[aria-selected="true"],#qres li:hover{background:var(--tint)}
.pill{font-size:.78rem;border-radius:999px;padding:3px 10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{border-color:var(--ok);color:var(--ok)} .pill.ro{border-color:var(--warn);color:var(--warn)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.canvas{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;min-width:0;display:flex;flex-direction:column;gap:10px}
.cap{margin:0;color:var(--muted);font-size:.88rem;max-width:100ch}
.cap b{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tools .hint{color:var(--muted);font-size:.8rem;margin-right:auto}
.frame{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.frame svg{display:block;width:100%;height:auto;max-height:80vh;touch-action:none;cursor:grab}
.frame svg:active{cursor:grabbing}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums}
.svcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.svccard{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:9px 11px;cursor:pointer;color:var(--ink)}
.svccard:hover{border-color:var(--accent)}
.svccard .nm{font-weight:600;display:flex;gap:7px;align-items:center}
.svccard .sub{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.dotc{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
h2.sec{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;font-weight:600}
aside.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;position:sticky;top:max(12px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:11px;min-width:0;max-height:calc(100vh - 40px);overflow:auto}
@media (max-width:980px){aside.card{position:static;max-height:none}}
aside .kind{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
aside h3{margin:0;font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere}
aside h4{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px;font-weight:600}
aside ul{margin:0;padding-left:18px;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
aside ul.plain{list-style:none;padding-left:0}
aside .rows{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font-size:.85rem;margin:0}
aside .rows dt{color:var(--muted)} aside .rows dd{margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--ink)}
.chip.ok{border-color:var(--ok);color:var(--ok)} .chip.prop{border-color:var(--prop);color:var(--prop)} .chip.warn{border-color:var(--warn);color:var(--warn)} .chip.bad{border-color:var(--bad);color:var(--bad)}
.lnk{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-align:left;text-decoration:underline;text-underline-offset:2px;font-size:inherit;overflow-wrap:anywhere}
.note{font-size:.88rem;background:var(--tint);border-radius:6px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.form{display:flex;flex-direction:column;gap:7px;border-top:1px solid var(--line);padding-top:10px}
.form label{font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.form input,.form select,.form textarea{font:inherit;font-size:.88rem;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--surface);color:var(--ink);width:100%;box-sizing:border-box}
.form textarea{min-height:76px;resize:vertical}
.row2{display:flex;gap:6px;flex-wrap:wrap}
.msg{font-size:.82rem;color:var(--warn);margin:0}
textarea.export{font-family:var(--f-mono);font-size:.74rem;width:100%;box-sizing:border-box;min-height:260px;border:1px solid var(--line);border-radius:6px;background:var(--tint);color:var(--ink);padding:8px}
.list{max-height:320px;overflow:auto}
.syncb{display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px;padding:10px 12px;font-size:.88rem}
.syncb.warn{border-left-color:var(--warn)} .syncb span{color:var(--muted)} .syncb ul{margin:4px 0 0;padding-left:18px;max-height:200px;overflow:auto}
/* svg */
svg text{font-family:var(--f-ui)}
.box rect.b{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.box rect.h{fill:var(--tint)}
.box.sel rect.b{stroke:var(--accent);stroke-width:2.6}
.box.rel rect.b{stroke:var(--hot);stroke-width:2}
.box.prop rect.b{stroke:var(--prop);stroke-dasharray:6 4;stroke-width:1.6}
.box.st-drop rect.h{fill:color-mix(in srgb,var(--bad) 22%,var(--tint))}
.box.st-change rect.h{fill:color-mix(in srgb,var(--warn) 24%,var(--tint))}
.box.st-new rect.h{fill:color-mix(in srgb,var(--prop) 22%,var(--tint))}
.box.st-keep rect.h{fill:color-mix(in srgb,var(--ok) 20%,var(--tint))}
.box .hdrhit{fill:transparent;cursor:move}
.tn{font-size:12.5px;font-weight:600;fill:var(--ink)}
.tc{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
.cn{font-family:var(--f-mono);font-size:10.5px;fill:var(--ink)}
.cn.inh{fill:var(--muted)}
.ct{font-family:var(--f-mono);font-size:9.5px;fill:var(--muted)}
.ctag{font-family:var(--f-mono);font-size:8.5px;font-weight:600;fill:var(--accent)}
.ctag.fk{fill:var(--d-sell)}
.crow{cursor:pointer}
.crow rect{fill:transparent}
.crow:hover rect{fill:var(--tint)}
.crow.sel rect{fill:color-mix(in srgb,var(--accent) 18%,transparent)}
.crow.prop .cn{fill:var(--prop)}
.crow.noted .cn{text-decoration:underline dotted;text-decoration-color:var(--warn)}
.xchip{font-family:var(--f-mono);font-size:9px;cursor:pointer;text-decoration:underline}
.inbadge{font-family:var(--f-mono);font-size:9.5px;fill:var(--hot);cursor:pointer}
.ndot{fill:var(--warn)}
.e{fill:none;stroke:var(--muted);stroke-width:1.2}
.e.soft{stroke-dasharray:5 4}
.e.inferred{stroke-dasharray:2 4}
.e.prop{stroke:var(--prop);stroke-dasharray:6 4;stroke-width:1.6}
.e.hot{stroke:var(--hot);stroke-width:2.4}
.e.dim{opacity:.18}
.mk{fill:none;stroke:var(--muted);stroke-width:1.3}
.mk.hot{stroke:var(--hot)} .mk.prop{stroke:var(--prop)}
.bundle{fill:none;stroke:var(--accent);opacity:.55;cursor:pointer}
.bundle:hover,.bundle.hot{opacity:1;stroke:var(--hot)}
.blbl{font-family:var(--f-mono);font-size:10px;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px;pointer-events:none}
.snode{cursor:pointer}
.snode circle{stroke:var(--surface);stroke-width:2}
.snode text{font-size:11.5px;fill:var(--ink);font-weight:600}
.snode .cnt{font-family:var(--f-mono);font-size:10px;fill:var(--muted);font-weight:400}
.snode:hover text{fill:var(--accent)}
.snode:focus-visible circle{stroke:var(--accent);stroke-width:4}
@media (prefers-reduced-motion:no-preference){.e,.bundle{transition:opacity .15s}}
</style>

<div class="wrap">
  <header>
    <h1>UniPOS Living ERD</h1>

  <div class="main">
    <section class="canvas" id="canvas" aria-live="polite"></section>
    <aside class="card" id="card"></aside>
  </div>
</div>

<script>/* UniPOS Living ERD — shared core: SQL type mapping and DBML / PostgreSQL / Mermaid generators.
   Used by build.py (through node) and by the page itself. */
(function (root) {
  function sqlType(c) {
    if (c.enum) return "varchar(" + (c.len || 50) + ")";
    const t = (c.t || "").replace(/^java\.\w+\./, "");
    if (/\[\]$|^(List|Set)</.test(t)) {
      const inner = t.replace(/\[\]$/, "").replace(/^(List|Set)<(.+)>$/, "$2");
      return sqlType({ t: inner }) + "[]";
    }
    switch (t) {
      case "String": return c.len ? "varchar(" + c.len + ")" : "varchar(255)";
      case "UUID": return "uuid";
      case "Integer": case "int": case "Short": case "short": return "integer";
      case "Long": case "long": return "bigint";
      case "BigDecimal": return c.prec ? "numeric(" + c.prec + ")" : "numeric";
      case "Double": case "double": return "double precision";
      case "Float": case "float": return "real";
      case "Boolean": case "boolean": return "boolean";
      case "LocalDate": case "Date": return "date";
      case "LocalDateTime": case "Timestamp": return "timestamp";
      case "Instant": case "OffsetDateTime": case "ZonedDateTime": return "timestamptz";
      case "LocalTime": return "time";
      case "byte[]": return "bytea";
      case "Map<String,Object>": case "JsonNode": return "jsonb";
      default: return c.rel ? "bigint" : "varchar(255)";
    }
  }
  const q = n => /^[a-z_][a-z0-9_]*$/.test(n) ? n : '"' + String(n).replace(/"/g, '""') + '"';
  const dq = s => "'" + String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'").replace(/\n/g, " ") + "'";

  /* merge code layer + design layer for one service:
     d = per-service data, notes = {key: {text,status}}, props = [proposal docs] */
  function view(d, notes, props) {
    notes = notes || {}; props = (props || []).filter(p => p.svc === d.svc && p.state !== "done");
    const tables = d.tables.map(t => ({ ...t, cols: t.cols.filter(c => !c.virt).map(c => ({ ...c })) }));
    const byName = Object.fromEntries(tables.map(t => [t.t, t]));
    props.filter(p => p.kind === "table").forEach(p => {
      if (!byName[p.table]) { const t = { t: p.table, cls: "", proposed: true, note: p.note || "", cols: [{ c: "id", t: "UUID", pk: 1 }] }; tables.push(t); byName[p.table] = t; }
    });
    props.filter(p => p.kind === "column").forEach(p => {
      const t = byName[p.table]; if (t && !t.cols.some(c => c.c === p.col)) t.cols.push({ c: p.col, t: p.type || "String", proposed: true, pnote: p.note || "" });
    });
    tables.forEach(t => {
      const tn = notes[d.svc + "~" + t.t]; if (tn) { t.dnote = tn.text || ""; t.status = tn.status || ""; }
      t.cols.forEach(c => { const cn = notes[d.svc + "~" + t.t + "~" + c.c]; if (cn) { c.dnote = cn.text || ""; c.status = cn.status || ""; } });
    });
    const refs = d.refs.map(r => ({ ...r }));
    props.filter(p => p.kind === "ref").forEach(p => refs.push({ ft: p.table, fc: p.col, ts: p.to.svc, tt: p.to.table, tc: p.to.col || "id", kind: p.to.svc === d.svc ? "soft" : "xs", proposed: true, pnote: p.note || "" }));
    return { svc: d.svc, head: d.head, tables, refs };
  }

  function colNote(c, refs, t) {
    const parts = [];
    if (c.inh) parts.push("inherited from " + c.inh);
    const r = refs.find(r => r.ft === t.t && r.fc === c.c);
    if (r && r.kind === "xs") parts.push("→ " + r.ts + "." + r.tt + "." + r.tc + " (other service, no FK)");
    if (r && r.kind === "poly") parts.push("polymorphic → " + r.poly.map(p => p.join(".")).join(" | "));
    if (r && r.inferred) parts.push("reference inferred from the column name");
    if (c.proposed) parts.push("PROPOSED" + (c.pnote ? ": " + c.pnote : ""));
    if (c.status) parts.push("status: " + c.status);
    if (c.dnote) parts.push(c.dnote);
    return parts.join(" · ");
  }

  function dbml(v, opts) {
    opts = opts || {};
    const L = [];
    if (opts.header !== false) L.push("// UniPOS · " + v.svc + "-service · generated from @Entity code (" + (v.head ? v.head.branch + " " + v.head.commit : "") + ")", "");
    v.tables.forEach(t => {
      const tnote = [t.proposed ? "PROPOSED" : "", t.cls ? "entity " + t.cls : "", t.status ? "status: " + t.status : "", t.dnote || t.note || ""].filter(Boolean).join(" · ");
      L.push("Table " + q(v.svc) + "." + q(t.t) + (tnote ? " [note: " + dq(tnote) + "]" : "") + " {");
      t.cols.forEach(c => {
        const s = [];
        if (c.pk) s.push("pk");
        if (c.nn && !c.pk) s.push("not null");
        if (c.uq) s.push("unique");
        const n = colNote(c, v.refs, t); if (n) s.push("note: " + dq(n));
        const ty = sqlType(c); L.push("  " + q(c.c) + " " + (/^[A-Za-z_]\w*(\(\d+(,\d+)?\))?(\[\])?$/.test(ty) ? ty : '"' + ty + '"') + (s.length ? " [" + s.join(", ") + "]" : ""));
      });
      L.push("}", "");
    });
    const known = new Set(v.tables.map(t => v.svc + "." + t.t));
    v.refs.forEach(r => {
      if (r.kind === "poly") return;
      const target = r.ts + "." + r.tt;
      if (!opts.all && r.ts !== v.svc) return;                 // cross-service refs live in column notes per file
      if (opts.all && opts.known && !opts.known.has(target)) return;
      if (!opts.all && !known.has(target)) return;
      const sym = r.rel === "OneToOne" ? "-" : ">";
      const tag = r.kind === "fk" ? "" : " // " + (r.kind === "xs" ? "cross-service id, no FK" : "id only, no FK") + (r.proposed ? ", PROPOSED" : "");
      L.push("Ref: " + q(v.svc) + "." + q(r.ft) + "." + q(r.fc) + " " + sym + " " + q(r.ts) + "." + q(r.tt) + "." + q(r.tc) + tag);
    });
    return L.join("\n") + "\n";
  }

  function sql(v) {
    const L = ["-- UniPOS · " + v.svc + "-service · PostgreSQL DDL generated from @Entity code", "CREATE SCHEMA IF NOT EXISTS " + q(v.svc) + ";", ""];
    v.tables.forEach(t => {
      L.push("CREATE TABLE " + q(v.svc) + "." + q(t.t) + " (");
      const lines = t.cols.map(c => "  " + q(c.c) + " " + sqlType(c) + (c.pk ? " PRIMARY KEY" : "") + (c.nn && !c.pk ? " NOT NULL" : "") + (c.uq ? " UNIQUE" : ""));
      L.push(lines.join(",\n"), ");");
      const tn = [t.proposed ? "PROPOSED" : "", t.dnote].filter(Boolean).join(" · "); if (tn) L.push("COMMENT ON TABLE " + q(v.svc) + "." + q(t.t) + " IS " + dq(tn).replace(/\\'/g, "''") + ";");
      t.cols.forEach(c => { const n = colNote(c, v.refs, t); if (n) L.push("COMMENT ON COLUMN " + q(v.svc) + "." + q(t.t) + "." + q(c.c) + " IS " + dq(n).replace(/\\'/g, "''") + ";"); });
      L.push("");
    });
    v.refs.filter(r => r.kind === "fk" && r.ts === v.svc).forEach(r =>
      L.push("ALTER TABLE " + q(v.svc) + "." + q(r.ft) + " ADD FOREIGN KEY (" + q(r.fc) + ") REFERENCES " + q(r.ts) + "." + q(r.tt) + " (" + q(r.tc) + ");"));
    return L.join("\n") + "\n";
  }

  function mermaid(v) {
    const id = n => (v.svc + "_" + n).replace(/[^A-Za-z0-9_]/g, "_");
    const L = ["```mermaid", "erDiagram"];
    v.tables.forEach(t => {
      L.push("  " + id(t.t) + " {");
      t.cols.forEach(c => {
        const k = c.pk ? " PK" : v.refs.some(r => r.ft === t.t && r.fc === c.c) ? " FK" : "";
        L.push("    " + sqlType(c).replace(/[^A-Za-z0-9_]/g, "_") + " " + c.c.replace(/[^A-Za-z0-9_]/g, "_") + k);
      });
      L.push("  }");
    });
    v.refs.filter(r => r.ts === v.svc && r.kind !== "poly").forEach(r => {
      const rel = r.rel === "OneToOne" ? "||--||" : "}o--||";
      L.push("  " + id(r.ft) + " " + rel + " " + id(r.tt) + ' : "' + r.fc + (r.kind === "fk" ? "" : " (no FK)") + '"');
    });
    L.push("```");
    return L.join("\n") + "\n";
  }

  const api = { sqlType, view, dbml, sql, mermaid };
  if (typeof module !== "undefined" && module.exports) module.exports = api; else root.ErdCore = api;
})(typeof window !== "undefined" ? window : globalThis);
</script>
<script>(function () {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DOM = { authentication: "d-id", authorization: "d-id", configuration: "d-id", product: "d-md", customer: "d-md", purchase: "d-pr", approval: "d-pr", inventory: "d-pr",
  sales: "d-sell", policy: "d-sell", promotion: "d-sell", payment: "d-sell", accounts: "d-fin", vat: "d-fin", report: "d-fin", compliance: "d-sup", notification: "d-sup" };

const S = { idx: null, data: {}, view: "home", svc: null, sel: null, notes: {}, props: [], layout: {}, localPos: {}, expanded: {}, vb: {},
  db: null, user: null, downloads: null, canWrite: null, uid: null, ro: false, dragging: false, resetArm: 0, msg: "" };

/* ---------------- loading ---------------- */
let EMBED = null;
try { EMBED = JSON.parse(document.getElementById("erd-data").textContent); } catch (e) { EMBED = null; }
async function getJSON(p) {
  const key = p.replace(/^data\//, "").replace(/\.json$/, "");
  if (EMBED && EMBED[key]) return EMBED[key];
  const r = await fetch(p); if (!r.ok) throw new Error(p + " " + r.status); return r.json();
}
async function loadSvc(s) { if (!S.data[s]) S.data[s] = await getJSON("data/" + s + ".json"); return S.data[s]; }

/* ---------------- design layer (shared db) ---------------- */
let unsubLayout = null, writeChain = Promise.resolve();
async function initShared() {
  const c = window.claude;
  if (!c || typeof c.use !== "function") { setSync(location.protocol === "file:" ? "file" : "off"); return; }
  const [db, user, downloads] = await Promise.all([c.use("db"), c.use("user"), c.use("downloads")]);
  S.downloads = downloads; S.user = user;
  if (!db) { setSync("off"); return; }
  S.db = db;
  if (user) { S.canWrite = await user.can("data.write"); S.uid = await user.id(); }
  setSync(S.canWrite === false ? "ro" : "live");
  db.collection("notes").onSnapshot(snap => { const n = {}; snap.docs.forEach(d => { n[d.id] = d.data(); }); S.notes = n; refresh(); }, () => setSync("off"));
  db.collection("proposals").onSnapshot(snap => { S.props = snap.docs.map(d => ({ id: d.id, ...d.data() })); refresh(); }, () => {});
  if (S.svc) subscribeLayout(S.svc);
}
function subscribeLayout(svc) {
  if (!S.db) return;
  if (unsubLayout) unsubLayout();
  unsubLayout = S.db.doc("layouts/" + svc).onSnapshot(d => { S.layout[svc] = d.exists ? (d.data().pos || {}) : {}; if (!S.dragging && S.view === "svc" && S.svc === svc) renderSvc(); }, () => {});

async function copyExport() { const out = $("xOut"); if (!out.value) await genExport();
  try { await navigator.clipboard.writeText(out.value); S.msg = "Copied."; } catch (e) { out.focus(); out.select(); S.msg = "Press Ctrl+C (⌘C) to copy the selected text."; }
  const m = document.querySelector("#card .msg"); if (m) m.textContent = S.msg; else $("card").insertAdjacentHTML("beforeend", `<p class="msg">${esc(S.msg)}</p>`); }
async function dlExport() { const out = $("xOut"); if (!out.value) await genExport();
  try { await S.downloads.save({ filename: out.dataset.name || "unipos-erd.txt", data: out.value }); } catch (e) { const m = e && e.code === "declined" ? "Download cancelled." : "Downloads aren't available here; use Copy."; $("card").insertAdjacentHTML("beforeend", `<p class="msg">${esc(m)}</p>`); } }

/* ---------------- events ---------------- */
function go(spec) { const [s, t, c] = spec.split("|"); if (!S.idx.services[s]) return; open("svc", s, null, { t, c: c || null }); }
document.addEventListener("click", e => {
  const svg = e.target.closest("svg"); if (svg && svg.dataset.moved === "1") { svg.dataset.moved = ""; return; }
  const a = e.target.closest("[data-svc]"); if (a && !e.target.closest("#card")) { open("svc", a.dataset.svc); return; }
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const bu = e.target.closest("[data-bundle]"); if (bu) { S.sel = { bundle: bu.dataset.bundle.split(">") }; if (S.view === "home") renderHome(); refreshCard(); return; }
  const pr = e.target.closest("[data-prop]"); if (pr) { S.sel = { prop: pr.dataset.prop }; refreshCard(); return; }
  const fo = e.target.closest("[data-focus]"); if (fo) { zoomTo({ t: fo.dataset.focus }); return; }
  const inc = e.target.closest("[data-inc]"); if (inc) { S.sel = { inc: inc.dataset.inc }; refreshCard(); return; }
  const po = e.target.closest("[data-poly]"); if (po) { S.sel = { poly: po.dataset.poly.split("|"), t: po.dataset.poly.split("|")[0] }; S.sel.c = null; refreshCard(); return; }
  const ih = e.target.closest("[data-inh]"); if (ih) { const k = S.svc + "~" + ih.dataset.inh; S.expanded[k] = !S.expanded[k]; renderSvc(); return; }
  const cr = e.target.closest(".crow[data-c]"); if (cr) { const t = cr.closest(".box").dataset.t; S.sel = { t, c: cr.dataset.c }; renderSvc(); refreshCard(); return; }
  const act = e.target.closest("[data-act]"); if (act) { doAct(act.dataset.act, act); return; }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("snode")) { e.preventDefault(); open("svc", e.target.dataset.svc); } });
document.addEventListener("change", e => {
  if (e.target.id === "pKind") syncProposeForm();
  if (e.target.id === "pTs") fillTargetTables();
});
function syncProposeForm() { const k = $("pKind").value; $("lCol").hidden = k === "table"; $("lType").hidden = k !== "column"; $("refBox").hidden = k !== "ref"; if (k === "ref") fillTargetTables(); }
function fillTargetTables() { const s = $("pTs").value; $("pTt").innerHTML = Object.keys(S.idx.services[s].tables).sort().map(t => `<option>${esc(t)}</option>`).join(""); }
const NAME = /^[a-z][a-z0-9_]{0,62}$/;
function doAct(act, el) {
  if (act === "saveNote") { const k = el.closest("[data-notekey]").dataset.notekey, text = $("noteText").value.trim(), status = $("noteStatus").value;
    if (!text && !status) { S.msg = "Write a note or pick a status first."; refreshCard(); return; }
    write(() => S.db.doc("notes/" + k).set({ text, status, by: S.uid, at: now() }), "Note saved for everyone."); }
  else if (act === "delNote") { const k = el.closest("[data-notekey]").dataset.notekey; write(() => S.db.doc("notes/" + k).delete(), "Note deleted."); }
  else if (act === "proposeHere") { S.sel = { propose: 1, table: el.dataset.table }; refreshCard(); }
  else if (act === "cancel") { S.sel = null; S.msg = ""; refreshCard(); }
  else if (act === "saveProp") {
    const kind = $("pKind").value, table = $("pTable").value.trim(), col = $("pCol").value.trim(), note = $("pNote").value.trim();
    if (!NAME.test(table)) { S.msg = "Table name: lowercase letters, digits and underscores."; showMsg(); return; }
    if (kind !== "table" && !NAME.test(col)) { S.msg = "Column name: lowercase letters, digits and underscores."; showMsg(); return; }
    const doc = { svc: S.svc, kind, table, note, state: "open", by: S.uid, at: now() };
    if (kind === "column") { doc.col = col; doc.type = $("pType").value; }
    if (kind === "ref") { const ts = $("pTs").value, tt = $("pTt").value; doc.col = col; doc.to = { svc: ts, table: tt, col: (S.idx.services[ts].tables[tt] || ["id"])[0] }; }
    write(() => S.db.collection("proposals").add(doc).then(ref => { S.sel = { prop: ref.id }; }), "Proposal saved for everyone.");
  }
  else if (act === "toggleProp") { const p = S.props.find(x => x.id === el.dataset.id); if (p) write(() => S.db.doc("proposals/" + p.id).update({ state: p.state === "done" ? "open" : "done", at: now() })); }
  else if (act === "delProp") { const id = el.dataset.id; write(() => S.db.doc("proposals/" + id).delete().then(() => { S.sel = null; }), "Proposal deleted."); }
  else if (act === "genExport") genExport();
  else if (act === "copyExport") copyExport();
  else if (act === "dlExport") dlExport();
}
function showMsg() { const m = document.querySelector("#card .msg"); if (m) m.textContent = S.msg; else $("card").insertAdjacentHTML("beforeend", `<p class="msg">${esc(S.msg)}</p>`); }

/* ---------------- search ---------------- */
let INDEX = [];
function buildIndex() {
  Object.entries(S.idx.services).forEach(([s, v]) => { INDEX.push({ k: s, l: s + "-service", t: "service", go: s + "||" });
    Object.entries(v.tables).forEach(([t, cols]) => { INDEX.push({ k: t, l: s + "." + t, t: "table", go: s + "|" + t + "|" });
      cols.forEach(c => INDEX.push({ k: t + "." + c, l: s + "." + t + "." + c, t: "column", go: s + "|" + t + "|" + c })); }); });
  INDEX.forEach(x => x.kl = x.l.toLowerCase());
}
function search(q) { q = q.trim().toLowerCase(); if (q.length < 2) return []; const pri = { service: 0, table: 1, column: 2 };
  return INDEX.filter(x => x.kl.includes(q)).map(x => ({ x, r: (x.kl.split(".").pop().startsWith(q) ? 0 : 10) + pri[x.t] })).sort((a, b) => a.r - b.r || a.x.l.length - b.x.l.length).slice(0, 16).map(o => o.x); }
const qi = $("q"), qr = $("qres"); let qsel = 0, qlist = [];
qi.addEventListener("input", () => { qlist = search(qi.value); qsel = 0; qr.hidden = !qlist.length; qi.setAttribute("aria-expanded", String(!!qlist.length));
  qr.innerHTML = qlist.map((x, i) => `<li role="option" id="qo${i}" aria-selected="${i === 0}" data-i="${i}"><span class="chip">${x.t}</span><span class="mono">${esc(x.l)}</span></li>`).join(""); });
qi.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!qlist.length) return; qsel = (qsel + (e.key === "ArrowDown" ? 1 : -1) + qlist.length) % qlist.length; [...qr.children].forEach((c, i) => c.setAttribute("aria-selected", String(i === qsel))); qi.setAttribute("aria-activedescendant", "qo" + qsel); }
  else if (e.key === "Enter" && qlist[qsel]) { pick(qlist[qsel]); } else if (e.key === "Escape") qr.hidden = true; });
qr.addEventListener("mousedown", e => { const l = e.target.closest("li"); if (!l) return; e.preventDefault(); pick(qlist[+l.dataset.i]); });
qi.addEventListener("blur", () => setTimeout(() => { qr.hidden = true; }, 150));
function pick(x) { qr.hidden = true; qi.blur(); const [s, t, c] = x.go.split("|"); if (!t) open("svc", s); else open("svc", s, null, { t, c: c || null }); }

/* ---------------- boot ---------------- */
$("homeBtn").onclick = () => open("home");
$("svcSel").onchange = e => { if (e.target.value) open("svc", e.target.value); else open("home"); };
(async function boot() {
  try { S.status = await getJSON("data/status.json"); } catch (e) { S.status = null; }
  try { S.idx = await getJSON("data/index.json"); }
  catch (e) { $("canvas").innerHTML = `<p class="cap">The ERD data could not be loaded. Open this page through its claude.ai link.</p>`; return; }
  $("svcSel").innerHTML = `<option value="">Choose a service…</option>` + Object.keys(S.idx.services).map(s => `<option value="${s}">${s}-service (${Object.keys(S.idx.services[s].tables).length})</option>`).join("");
  $("sub").textContent = `Every table of every UniPOS service, drawn from the @Entity code (built ${S.idx.built}). Notes, status and proposed changes are shared with everyone who can open this page.`;
  buildIndex();
  const h = (location.hash || "").replace(/^#/, "");
  if (h && S.idx.services[h]) open("svc", h); else open("home");
  initShared();
})();
})();
</script>
